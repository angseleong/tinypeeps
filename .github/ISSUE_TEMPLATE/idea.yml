name: An idea
description: Something the app could do, or do better.
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: need
    attributes:
      label: What would help you?
      description: The company you run, what you do today, and what's hard about it.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: Optional. A rough idea or a sketch is fine.

  - type: dropdown
    id: where
    attributes:
      label: Which part of the app?
      multiple: true
      options:
        - The office
        - Templates and Roles
        - Approvals
        - Saving tokens
        - Something new
